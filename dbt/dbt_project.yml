name: settlement
version: "1.0.0"
profile: settlement
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, logs]

models:
  settlement:
    silver:
      +schema: silver
      +materialized: table
    gold:
      # Área de build. Os consumidores leem gold.*, views publicadas pelo pipeline
      # depois que todos os testes passam (ver src/settlement_pipeline/publish.py).
      +schema: gold_build
      +materialized: table

name: settlement
version: "1.0.0"
profile: settlement
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, logs]

vars:
  # Processadores de liquidação. Cada um tem um modelo <nome>_settlements_checked que traduz
  # o arquivo dele para o formato comum (ver models/silver/settlements.sql).
  settlement_processors: [paysettler]

models:
  settlement:
    silver:
      +schema: silver
      +materialized: table
    gold:
      # Área de build. Os consumidores leem gold.*, views publicadas pelo pipeline
      # depois que todos os testes passam (ver src/settlement_pipeline/publish.py).
      +schema: gold_build
      +materialized: table

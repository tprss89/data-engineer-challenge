# O "banco" do dbt é o DuckLake. O arquivo DuckDB local é só área de trabalho da sessão.
settlement:
  target: local
  outputs:
    local:
      type: duckdb
      path: ":memory:"
      extensions: [ducklake]
      settings:
        TimeZone: UTC
      # Definidos na criação do banco, não por cursor: o DuckDB não deixa trocar a pasta
      # temporária depois de usá-la. Acima do limite ele despeja em disco em vez de crescer
      # (o padrão seria 80% da RAM).
      config_options:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '4GB') }}"
        temp_directory: "{{ env_var('DUCKDB_TEMP_DIRECTORY', '/tmp/duckdb_tmp') }}"
      attach:
        - path: "ducklake:{{ env_var('LAKE_PATH') }}/catalog.ducklake"
          alias: lake
          options:
            data_path: "{{ env_var('LAKE_PATH') }}/files/"
      database: lake
      schema: silver
      # O catálogo aceita um escritor por vez; uma thread evita conflito entre modelos.
      threads: 1

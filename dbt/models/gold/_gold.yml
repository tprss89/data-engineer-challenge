# Produtos de dados por consumidor. As perguntas que cada tabela responde (e as que não
# responde) estão em docs/data-products.md, com queries de exemplo em docs/queries/.
#
# Cada modelo tem contrato: nome e tipo de cada coluna estão fixados aqui, e o build falha
# se um modelo mudar o formato que os consumidores esperam. Mudar o contrato é uma decisão,
# não um efeito colateral.

version: 2
models:
- name: dim_merchant
  description: Merchant com histórico (SCD2). Um fato aponta para a versão do cadastro válida na data
    do evento. merchant_key = '-1' é o membro "não identificado".
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - merchant_id
      config:
        where: is_current and merchant_key <> '-1'
  - scd2_no_overlap:
      arguments:
        key: merchant_id
        valid_from: valid_from
        valid_to: valid_to
  columns:
  - name: merchant_key
    data_type: varchar
    data_tests:
    - unique
    - not_null
  - name: merchant_id
    data_type: varchar
  - name: legal_name
    data_type: varchar
  - name: trade_name
    data_type: varchar
  - name: document
    data_type: varchar
  - name: document_digits
    data_type: varchar
  - name: primary_cnae
    data_type: varchar
  - name: primary_cnae_digits
    data_type: varchar
  - name: cnae_division
    data_type: varchar
    description: Dois primeiros dígitos do CNAE (divisão), usados como segmento.
  - name: registered_at
    data_type: timestamp with time zone
  - name: valid_from
    data_type: timestamp with time zone
  - name: valid_to
    data_type: timestamp with time zone
  - name: is_current
    data_type: boolean
  - name: is_deleted
    data_type: boolean
  - name: version
    data_type: bigint
  config:
    contract:
      enforced: true
- name: fct_reconciliation_result
  description: 'Um resultado efetivo de reconciliação por run e transação. Incremental por reference_date.
    Consumidores: Operações e Compliance.'
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - run_id
        - transaction_id
  - expression_is_true:
      arguments:
        expression: amount_at_risk >= 0
  columns:
  - name: result_id
    data_type: bigint
    data_tests:
    - unique
    - not_null
  - name: run_id
    data_type: bigint
  - name: reference_date
    data_type: date
    data_tests:
    - not_null
  - name: transaction_id
    data_type: varchar
  - name: merchant_id
    data_type: varchar
  - name: merchant_key
    data_type: varchar
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_merchant')
          field: merchant_key
  - name: category
    data_type: varchar
  - name: is_discrepancy
    data_type: boolean
  - name: currency
    data_type: varchar
    description: Moeda da transação interna; sem ela, a do arquivo do processador; sem os dois, BRL.
    data_tests:
    - not_null
  - name: currency_source
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values:
          - internal_transaction
          - processor_file
          - assumed_brl
  - name: internal_amount
    data_type: decimal(18,2)
  - name: processor_amount
    data_type: decimal(18,2)
  - name: difference
    data_type: decimal(18,2)
  - name: amount_at_risk
    data_type: decimal(18,2)
    description: 'Dinheiro envolvido na discrepância, na moeda da coluna currency: a diferença no MISMATCHED,
      o valor do lado que existe nos UNRECONCILED, zero no MATCHED.'
  - name: reconciled_at
    data_type: timestamp with time zone
  - name: _batch_id
    data_type: varchar
  - name: _source_file
    data_type: varchar
  config:
    contract:
      enforced: true
- name: agg_run_health
  description: Uma linha por execução da reconciliação. Consumidor - Operações.
  columns:
  - name: run_id
    data_type: bigint
    data_tests:
    - unique
    - not_null
  - name: reference_date
    data_type: date
  - name: run_status
    data_type: varchar
  - name: file_name
    data_type: varchar
  - name: started_at
    data_type: timestamp with time zone
  - name: completed_at
    data_type: timestamp with time zone
  - name: duration_seconds
    data_type: bigint
  - name: declared_results
    data_type: bigint
  - name: results_received
    data_type: bigint
  - name: results_quarantined
    data_type: bigint
  - name: effective_results
    data_type: bigint
  - name: matched
    data_type: bigint
  - name: mismatched
    data_type: bigint
  - name: unreconciled_processor
    data_type: bigint
  - name: unreconciled_internal
    data_type: bigint
  - name: amount_at_risk_brl
    data_type: decimal(18,2)
    description: Valor em discrepância em BRL. Outras moedas ficam no fato, por moeda.
  - name: discrepancies_in_other_currencies
    data_type: bigint
  - name: discrepancies
    data_type: bigint
  - name: discrepancy_rate
    data_type: double
    description: Fração dos resultados efetivos que não são MATCHED. Null se o run não tem resultados.
  - name: days_since_previous_run
    data_type: bigint
  - name: previous_discrepancy_rate
    data_type: double
  - name: baseline_discrepancy_rate
    data_type: double
    description: Taxa agregada dos até 7 runs anteriores (sem contar o atual).
  - name: discrepancy_z_score
    data_type: double
    description: Quantos desvios padrão a taxa do run está acima da linha de base, considerando o número
      de resultados do run. Acima de 3 vira DISCREPANCY_SPIKE.
  - name: health_status
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - DISCREPANCY_SPIKE
          - INCOMPLETE
          - IN_PROGRESS
          - FAILED
  config:
    contract:
      enforced: true
- name: fct_transaction_reconciliation_status
  description: Situação de cada transação considerando todos os runs em que apareceu. Separa discrepância
    ainda aberta de discrepância já resolvida. Consumidor - Operações.
  columns:
  - name: transaction_id
    data_type: varchar
    data_tests:
    - unique
    - not_null
  - name: merchant_id
    data_type: varchar
  - name: merchant_key
    data_type: varchar
  - name: latest_category
    data_type: varchar
  - name: is_open
    data_type: boolean
  - name: was_resolved
    data_type: boolean
  - name: open_since
    data_type: date
  - name: days_open
    data_type: bigint
    description: Dias entre o início da discrepância atual e o run mais recente nos dados.
  - name: open_amount_at_risk
    data_type: decimal(18,2)
  - name: currency
    data_type: varchar
  - name: first_reference_date
    data_type: date
  - name: last_reference_date
    data_type: date
  - name: runs_count
    data_type: bigint
  - name: runs_with_discrepancy
    data_type: bigint
  - name: first_discrepancy_date
    data_type: date
  - name: as_of_date
    data_type: date
  config:
    contract:
      enforced: true
- name: fct_daily_volume
  description: 'Volume por dia, merchant e moeda: o transacionado (sistema interno) e o liquidado (PaySettler).
    Moedas não são somadas entre si. Consumidor - CFO.'
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - volume_date
        - merchant_id
        - currency
  - expression_is_true:
      arguments:
        expression: 'transacted_amount = completed_amount + pending_amount + failed_amount

          '
  config:
    contract:
      enforced: true
  columns:
  - name: volume_date
    data_type: date
  - name: merchant_id
    data_type: varchar
  - name: merchant_key
    data_type: varchar
  - name: currency
    data_type: varchar
  - name: transactions_count
    data_type: bigint
  - name: transacted_amount
    data_type: decimal(18,2)
  - name: completed_amount
    data_type: decimal(18,2)
  - name: pending_amount
    data_type: decimal(18,2)
  - name: failed_amount
    data_type: decimal(18,2)
  - name: settlements_count
    data_type: bigint
  - name: settled_amount
    data_type: decimal(18,2)
  - name: reversed_amount
    data_type: decimal(18,2)
  - name: net_settled_amount
    data_type: decimal(18,2)
- name: audit_transaction_trail
  description: Linha do tempo de cada transação com origem rastreável (arquivo, linha, hash). Consumidor
    - Compliance.
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - transaction_id
        - event_seq
  columns:
  - name: transaction_id
    data_type: varchar
  - name: event_seq
    data_type: bigint
  - name: event_at
    data_type: timestamp with time zone
  - name: event_type
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values:
          - internal_record_created
          - internal_record_updated
          - internal_record_deleted
          - reconciliation_result
          - reconciliation_result_quarantined
          - settlement_settled
          - settlement_reversed
  - name: source_system
    data_type: varchar
  - name: details
    data_type: json
  - name: source_file
    data_type: varchar
  - name: source_row
    data_type: bigint
  - name: source_file_sha256
    data_type: varchar
    data_tests:
    - not_null
  - name: ingested_at
    data_type: timestamp with time zone
  - name: ingestion_batch_id
    data_type: varchar
  config:
    contract:
      enforced: true

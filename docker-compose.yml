services:
  pipeline:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_PATH=/app/docs/sample-data
      - LAKE_PATH=/app/data/lake
      - DBT_PROFILES_DIR=/app/dbt
      - LOG_LEVEL=INFO
      - DUCKDB_MEMORY_LIMIT=4GB
      - ENVIRONMENT=local
    volumes:
      - ./docs:/app/docs:ro
      - ./data:/app/data
      - ./src:/app/src
      - ./contracts:/app/contracts
      - ./dbt:/app/dbt
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    command: tail -f /dev/null

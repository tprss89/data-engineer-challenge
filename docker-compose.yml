services:
  pipeline:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_PATH=/app/docs/sample-data
      - LAKE_PATH=/app/data/lake
      - DBT_PROFILES_DIR=/app/dbt
      - LOG_LEVEL=INFO
      - DUCKDB_MEMORY_LIMIT=4GB
      - ENVIRONMENT=local
    volumes:
      - ./docs:/app/docs:ro
      - ./data:/app/data
      - ./src:/app/src
      - ./contracts:/app/contracts
      - ./dbt:/app/dbt
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    # Sobe já rodando o pipeline no fixture (idempotente: subir de novo não duplica nada) e
    # depois fica de pé para os comandos `docker compose exec pipeline pipeline ...`.
    # Se o pipeline falhar, o container continua de pé para investigar.
    command: >
      sh -c "pipeline run --reference-date 2025-03-16;
             echo \"pipeline terminou (código $$?). Painel: docker compose exec pipeline pipeline status\";
             exec tail -f /dev/null"

[project]
name = "data-engineer-challenge"
version = "0.1.0"
description = "Data Engineer Technical Challenge"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6,<1.6",
    "pyarrow>=18.0",
    "dbt-duckdb>=1.11,<1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.scripts]
pipeline = "settlement_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# No Windows, o bind mount do Docker marca todo arquivo como executável.
ignore = ["EXE002"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/settlement_pipeline"]
